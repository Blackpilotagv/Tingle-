<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tingle Trade – Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">📈</span>
      <h1>Tingle Trade</h1>
      <p class="tagline">Professional Trading Terminal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="auth-tabs">
      <button class="tab active" onclick="showTab('login',this)">Login</button>
      <button class="tab" onclick="showTab('register',this)">Register</button>
      <button class="tab" onclick="showTab('forgot',this)">Forgot PW</button>
    </div>

    <form id="login" class="auth-form active" action="/login" method="POST">
      <input type="text"     name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="register" class="auth-form" action="/register" method="POST">
      <input type="text"     name="username" placeholder="Username" required>
      <input type="email"    name="email"    placeholder="Email"    required>
      <input type="tel"      name="phone"    placeholder="Phone">
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm"  placeholder="Confirm Password" required>
      <button type="submit">Create Account</button>
    </form>

    <form id="forgot" class="auth-form" action="/forgot_password" method="POST">
      <input type="email" name="email" placeholder="Registered Email" required>
      <button type="submit">Send OTP</button>
      <hr style="margin:12px 0; border-color:#333">
      <input type="text"     name="otp"          placeholder="Enter OTP"    form="reset">
      <input type="password" name="new_password"  placeholder="New Password" form="reset">
      <button type="submit" form="reset">Reset Password</button>
    </form>
    <form id="reset" action="/reset_password" method="POST"></form>
  </div>
</div>
<script>
function showTab(name, el) {
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  el.classList.add('active');
}
</script>
</body>
</html>
